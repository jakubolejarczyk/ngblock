<div>
  <button type="button" (click)="action.emit('default')">{{ label() }}</button>
  <button
    type="button"
    aria-label="More actions"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    (click)="open.update((value) => !value)"
  >
    More
  </button>
  @if (open()) {
  <div role="menu">
    @for (option of options(); track option.value) {
    <button type="button" role="menuitem" (click)="choose(option.value)">
      {{ option.label }}
    </button>
    }
  </div>
  }
</div>
