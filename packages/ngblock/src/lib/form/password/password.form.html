<label>
  {{ label() }}
  <input
    [type]="visible() ? 'text' : 'password'"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
  />
  <button
    type="button"
    [disabled]="disabled()"
    [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
    [attr.aria-pressed]="visible()"
    (click)="visible.update((value) => !value)"
  >
    {{ visible() ? 'Hide' : 'Show' }}
  </button>
</label>
