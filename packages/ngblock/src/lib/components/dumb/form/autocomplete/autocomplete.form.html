<label>
  {{ label() }}
  <input
    type="text"
    [value]="value()"
    [placeholder]="placeholder()"
    [attr.list]="'ngb-autocomplete-options'"
    (input)="onInput($event)"
  />
  <datalist id="ngb-autocomplete-options">
    @for (option of options(); track option) {
    <option [value]="option"></option>
    }
  </datalist>
</label>
