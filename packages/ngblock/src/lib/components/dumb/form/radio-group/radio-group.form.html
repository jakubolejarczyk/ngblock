<fieldset>
  <legend>{{ label() }}</legend>
  @for (option of options(); track option.value) {
  <label>
    <input
      type="radio"
      [name]="name()"
      [value]="option.value"
      [checked]="value() === option.value"
      [disabled]="disabled()"
      (change)="changed.emit(option.value)"
    />
    {{ option.label }}
  </label>
  }
</fieldset>
