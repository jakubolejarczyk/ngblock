<fieldset>
  <legend>{{ label() }}</legend>
  <div role="group" [attr.aria-label]="label()">
    @for (option of options(); track option.value) {
    <button
      type="button"
      [attr.aria-pressed]="value() === option.value"
      [disabled]="disabled()"
      (click)="changed.emit(option.value)"
    >
      {{ option.label }}
    </button>
    }
  </div>
</fieldset>
