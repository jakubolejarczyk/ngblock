@if (open()) {
<button
  type="button"
  class="dialog-backdrop"
  aria-label="Close dialog"
  (click)="close()"
></button>
<section
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="title()"
  tabindex="-1"
>
  <h2>{{ title() }}</h2>
  <button type="button" aria-label="Close dialog" (click)="close()">
    Close
  </button>
  <ng-content />
</section>
}
