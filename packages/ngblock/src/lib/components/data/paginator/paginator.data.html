<nav aria-label="Pagination">
  <button
    type="button"
    [disabled]="page() <= 0"
    aria-label="Previous page"
    (click)="goTo(page() - 1)"
  >
    Previous
  </button>
  <span aria-live="polite">Page {{ page() + 1 }} of {{ pageCount() }}</span>
  <button
    type="button"
    [disabled]="page() + 1 >= pageCount()"
    aria-label="Next page"
    (click)="goTo(page() + 1)"
  >
    Next
  </button>
</nav>
